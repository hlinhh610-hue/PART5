        "Mẹo: Liên từ 'Although' đi với mệnh đề, 'Despite' đi với Noun/V-ing.",
        "Mẹo: Các từ kết thúc bằng -ly thường là Trạng từ.",
        "Mẹo: Hãy dịch sơ qua nghĩa của câu trước khi chọn điền từ vựng."
      ];
      const randomTip = tips[Math.floor(Math.random() * tips.length)];

      return (
        <div className="flex flex-col items-center justify-center py-32 text-center">
          <Loader2 className="w-12 h-12 text-blue-500 animate-spin mb-6" />
          <h3 className="text-2xl font-bold text-white mb-2">{text}</h3>
          <p className="text-gray-400 mb-8">Xin vui lòng đợi trong giây lát, AI đang làm việc...</p>
          <div className="max-w-md bg-gray-800 border border-gray-700 p-5 rounded-2xl flex items-start text-left shadow-lg">
            <Lightbulb className="w-6 h-6 text-yellow-500 mr-3 shrink-0" />
            <p className="text-gray-300 font-medium text-sm leading-relaxed">{randomTip}</p>
          </div>
        </div>
      );
    };

    // --- SYNC MODE (Local JSON Export / Import for GitHub Pages) ---
    const SyncMode = ({ vocabBasket, favoritesBasket, setVocabBasket, setFavoritesBasket }) => {
      const [status, setStatus] = useState({ type: '', msg: '' });
      const fileInputRef = useRef(null);

      const handleExport = () => {
        const data = { vocab: vocabBasket, favorites: favoritesBasket, exportedAt: Date.now() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `toeic-master-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setStatus({ type: 'success', msg: 'Đã tải xuống file sao lưu dữ liệu (.json) thành công!' });
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            let count = 0;
            if (data.vocab) {
              setVocabBasket(prev => ({ ...prev, ...data.vocab }));
              count += Object.keys(data.vocab).length;
            }
            if (data.favorites) {
              setFavoritesBasket(prev => ({ ...prev, ...data.favorites }));
              count += Object.keys(data.favorites).length;
            }
            setStatus({ type: 'success', msg: `Khôi phục thành công ${count} mục từ file sao lưu!` });
          } catch {
            setStatus({ type: 'error', msg: 'File sao lưu không hợp lệ!' });
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="max-w-2xl mx-auto">
          <div className="text-center mb-10 mt-6">
            <div className="bg-indigo-900/30 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 border border-indigo-500/30">
              <Cloud className="w-10 h-10 text-indigo-400" />
            </div>
            <h2 className="text-3xl font-bold text-white mb-4">Sao Lưu & Khôi Phục Dữ Liệu</h2>
            <p className="text-gray-400 text-lg">
              Dữ liệu Rổ từ ({Object.keys(vocabBasket).length}) và Tâm đắc ({Object.keys(favoritesBasket).length}) được tự động lưu trên trình duyệt. Bạn có thể xuất file JSON để chuyển sang thiết bị khác.
            </p>
          </div>

          <div className="bg-gray-800 rounded-3xl shadow-xl border border-gray-700 p-8">
            {status.msg && (
              <div className={`p-4 rounded-xl mb-6 flex items-start ${status.type === 'success' ? 'bg-green-900/30 border border-green-500/50 text-green-300' : 'bg-red-900/30 border border-red-500/50 text-red-300'}`}>
                {status.type === 'success' ? <CheckCircle className="w-6 h-6 mr-3 flex-shrink-0" /> : <AlertCircle className="w-6 h-6 mr-3 flex-shrink-0" />}
                <p className="font-medium">{status.msg}</p>
              </div>
            )}

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <button onClick={handleExport} className="flex items-center justify-center px-6 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all">
                <Download className="w-5 h-5 mr-2" /> Xuất file sao lưu (.json)
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="flex items-center justify-center px-6 py-4 bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white font-bold rounded-xl transition-all">
                <Upload className="w-5 h-5 mr-2" /> Nhập file sao lưu
              </button>
              <input ref={fileInputRef} type="file" accept=".json" onChange={handleImport} className="hidden" />
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ToeicApp />);
  </script>
</body>
</html>
